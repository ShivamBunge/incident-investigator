# Read-only RBAC for the Kubernetes MCP server (spec Section 5.3 security
# requirements): dedicated ServiceAccount, demo namespace only, get/list/watch
# on workload resources. No Secrets, no exec, no write verbs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-investigator
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-investigator-readonly
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-investigator-readonly
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: incident-investigator
    namespace: demo
roleRef:
  kind: Role
  name: incident-investigator-readonly
  apiGroup: rbac.authorization.k8s.io